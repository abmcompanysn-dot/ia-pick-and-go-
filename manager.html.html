<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYFLEX - Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-3xl w-full">
        <div class="flex justify-between items-center mb-8">
            <a href="/" class="text-gray-400 hover:text-orange-400 transition"><i class="fas fa-arrow-left mr-2"></i>Retour au Hub</a>
            <h1 class="text-3xl font-bold text-orange-400">Manager Studio</h1>
        </div>

        <div class="glass p-8 rounded-2xl shadow-lg mb-8">
            <h2 class="text-2xl font-semibold mb-6">📦 Ajouter un Nouveau Produit</h2>
            <form id="addProductForm" class="space-y-4">
                <div>
                    <label for="productName" class="block text-sm font-medium text-gray-400 text-left mb-1">Nom du Produit (ex: coca)</label>
                    <input type="text" id="productName" name="productName" placeholder="Nom du produit" required
                           class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label for="productPrice" class="block text-sm font-medium text-gray-400 text-left mb-1">Prix (FCFA)</label>
                    <input type="number" id="productPrice" name="productPrice" placeholder="Prix" required
                           class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none focus:border-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-lg transition">
                    <i class="fas fa-plus-circle mr-2"></i>Ajouter Produit
                </button>
                <p id="addStatus" class="text-center text-sm mt-2"></p>
            </form>
            <a href="/register_product" class="block text-center mt-6 text-orange-400 hover:text-orange-300 transition">
                <i class="fas fa-camera mr-2"></i>Scanner Produit 360° (Dataset)
            </a>
        </div>

        <div class="glass p-8 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-semibold mb-6">📋 Base de Données Produits</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="bg-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Nom</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Prix (FCFA)</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody" class="divide-y divide-gray-800">
                        <!-- Products will be loaded here -->
                        <tr id="noProductsRow"><td colspan="2" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">Aucun produit enregistré.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const serverIp = localStorage.getItem('hyflex_server');
        if (!serverIp) {
            alert("L'adresse IP du serveur n'est pas configurée. Veuillez la saisir sur la page d'accueil.");
            window.location.href = '/';
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`https://${serverIp}:8000/api/products_data`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();
                
                const tableBody = document.getElementById('productsTableBody');
                tableBody.innerHTML = ''; // Clear previous products

                if (products.length === 0) {
                    tableBody.innerHTML = '<tr id="noProductsRow"><td colspan="2" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">Aucun produit enregistré.</td></tr>';
                } else {
                    products.forEach(product => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-white">${product.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${product.price} FCFA</td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error("Erreur lors de la récupération des produits:", error);
                alert("Impossible de charger les produits. Assurez-vous que le serveur est en ligne et que l'IP est correcte.");
            }
        }

        document.getElementById('addProductForm').onsubmit = async (e) => {
            e.preventDefault();
            const productName = document.getElementById('productName').value;
            const productPrice = document.getElementById('productPrice').value;
            const addStatus = document.getElementById('addStatus');
            addStatus.className = "text-center text-sm mt-2";
            addStatus.innerText = "⏳ Ajout en cours...";

            const formData = new FormData();
            formData.append('product_name', productName);
            formData.append('price', productPrice);

            try {
                const response = await fetch(`https://${serverIp}:8000/api/add_product_api`, { method: 'POST', body: formData });
                const data = await response.json();
                if (response.ok) {
                    addStatus.className += " text-green-400";
                    addStatus.innerText = data.message;
                    document.getElementById('addProductForm').reset();
                    fetchProducts(); // Refresh the list
                } else {
                    addStatus.className += " text-red-400";
                    addStatus.innerText = `Erreur: ${data.detail || data.message}`;
                }
            } catch (error) {
                addStatus.className += " text-red-400";
                addStatus.innerText = "Erreur réseau lors de l'ajout du produit.";
                console.error("Erreur:", error);
            }
        };

        fetchProducts();
    </script>
</body>
</html>
