services:
  - type: web
    name: jel-dem-dall-jamm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: NGROK_AUTH_TOKEN
        sync: false
