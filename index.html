<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { 
      background: #0a0a0b; color: white; font-family: 'Segoe UI', sans-serif; 
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; margin: 0; overflow: hidden;
    }
    
    .container { display: flex; gap: 40px; align-items: flex-start; padding: 20px; }

    .card { 
      width: 450px; padding: 40px; border-radius: 50px; 
      text-align: center; border: 8px solid #f97316; 
      background: #111114; box-shadow: 0 0 100px rgba(249, 115, 22, 0.1);
      transition: all 0.3s ease;
    }
    
    .history-panel {
      width: 550px; background: #111114; border-radius: 30px;
      border: 2px solid #222; padding: 25px; height: 600px;
      display: flex; flex-direction: column;
    }

    .history-header { 
      color: #f97316; font-weight: 900; font-size: 20px;
      margin-bottom: 20px; text-transform: uppercase;
      display: flex; justify-content: space-between;
    }

    .table-wrapper { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: #444; font-size: 12px; padding: 10px; border-bottom: 1px solid #222; }
    td { padding: 12px 10px; border-bottom: 1px solid #1a1a1e; font-size: 14px; font-weight: 600; }
    
    .brand { font-size: 28px; font-weight: 900; margin-bottom: 20px; letter-spacing: 2px; }
    .brand span { color: #facc15; }

    .photo-circle { 
      width: 200px; height: 200px; border-radius: 50%; 
      border: 6px solid #ffffff; margin: 0 auto 25px; 
      overflow: hidden; background: #1a1a1c;
      display: flex; align-items: center; justify-content: center;
    }
    img { width: 100%; height: 100%; object-fit: cover; }
    
    .status-badge { 
      padding: 10px 25px; border-radius: 15px; 
      font-weight: 900; font-size: 18px; color: #000; 
      background: #facc15; display: inline-block; margin-bottom: 20px;
    }

    .user-name { font-size: 36px; font-weight: 900; margin: 0; color: #fff; text-transform: uppercase; }
    .balance-tag { font-size: 28px; font-weight: 800; color: #22c55e; margin-top: 10px; }
    
    .access-granted { border-color: #22c55e !important; box-shadow: 0 0 100px rgba(34, 197, 94, 0.2); }
    .access-denied { border-color: #ef4444 !important; box-shadow: 0 0 100px rgba(239, 68, 68, 0.2); }
    
    .status-text { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #222; }
    .text-success { color: #22c55e; }
    .text-danger { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <!-- CARTE PRINCIPALE (DERNIER SCAN) -->
    <div id="displayCard" class="card">
      <div class="brand">JEL <span>DEM</span></div>
      <div id="badge" class="status-badge"><i class="fas fa-fingerprint"></i> VEILLE</div>
      <div class="photo-circle" id="userPhoto"><i class="fas fa-user-circle" style="font-size: 100px; color: #222;"></i></div>
      <div id="userName" class="user-name">SCANNEZ SVP</div>
      <div id="userBalance" class="balance-tag" style="display:none">0 FCFA</div>
    </div>

    <!-- PANNEAU HISTORIQUE LIVE -->
    <div class="history-panel">
      <div class="history-header">
        <span><i class="fas fa-list-ul"></i> Live Feed</span>
        <span id="liveClock" style="color:#555">--:--:--</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>HEURE</th><th>UTILISATEUR</th><th>ACTION / PRODUIT</th><th>MONTANT</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let lastProcessedTime = "";

    function refreshData() {
      // Horloge
      document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
      
      // 1. Mise à jour de la carte principale
      google.script.run.withSuccessHandler(function(data) {
        if (data.time !== lastProcessedTime) {
          lastProcessedTime = data.time;
          updateMainCard(data);
        }
      }).getLastLog();

      // 2. Mise à jour de l'historique
      google.script.run.withSuccessHandler(function(history) {
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = history.map(row => `
          <tr>
            <td style="color:#f97316">${row.time}</td>
            <td>${row.name}</td>
            <td><span class="status-text ${row.status.includes('REFUS') ? 'text-danger' : 'text-success'}">${row.status}</span></td>
            <td style="color:#22c55e">${row.amount > 0 ? row.amount + ' F' : '-'}</td>
          </tr>
        `).join('');
      }).getRecentLogs();
    }

    function updateMainCard(data) {
      const card = document.getElementById('displayCard');
      const badge = document.getElementById('badge');
      const photo = document.getElementById('userPhoto');
      const name = document.getElementById('userName');
      const balance = document.getElementById('userBalance');

      name.innerText = data.name;
      if (data.status.includes("ACCÈS") || data.status === "achat") {
        card.className = "card access-granted";
        badge.innerHTML = '<i class="fas fa-check-circle"></i> AUTORISÉ';
        badge.style.background = "#22c55e";
        balance.style.display = "block";
        balance.innerText = data.balance.toLocaleString() + " FCFA";
        photo.innerHTML = data.photo ? `<img src="${data.photo}">` : `<img src="https://api.qrserver.com/v1/create-qr-code/?data=${data.phone}&color=22c55e">`;
      } else {
        card.className = "card";
        badge.innerHTML = '<i class="fas fa-fingerprint"></i> VEILLE';
        badge.style.background = "#facc15";
        balance.style.display = "none";
        photo.innerHTML = '<i class="fas fa-user-circle" style="font-size: 100px; color: #222;"></i>';
      }
    }

    setInterval(refreshData, 1000);
  </script>
</body>
</html>
